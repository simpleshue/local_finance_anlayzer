services:
  finance-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-engine
    restart: unless-stopped
    ports:
      # Port 8811 mapped to container port 8811. Omit 127.0.0.1 to allow LAN access.
      - "${FINANCE_PORT:-8811}:8811"
    environment:
      - FINANCE_PASSPHRASE=${FINANCE_PASSPHRASE:-change-me-to-a-very-strong-passphrase}
      # Listen on 0.0.0.0 inside container so Docker bridge can forward LAN traffic
      - FINANCE_LISTEN=0.0.0.0:8811
      - FINANCE_HOME=/finances_runtime
      - FINANCE_CONFIG_DIR=/config
    cap_add:
      - IPC_LOCK
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ./data:/finances_runtime/data
      - ./config:/config
    tmpfs:
      - /finances_runtime/inbox:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=32m
